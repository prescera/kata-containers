apiVersion: v1
kind: Pod
metadata:
  name: dummy
spec:
  runtimeClassName: kata-cc-isolation
  containers:
  - name: dummy
    image: registry.k8s.io/pause:3.6@sha256:3d380ca8864549e74af4b29c10f9cb0956236dfb01c40ca076fb6c37253234db
    volumeMounts:
    - mountPath: /dev/store
      name: store
    securityContext:
      runAsUser: 65535
      runAsGroup: 0
  volumes:
  - name: store
    hostPath:
      path: /dev/loop7
      type: BlockDevice
